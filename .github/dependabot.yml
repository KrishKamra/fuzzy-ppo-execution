# Monthly, grouped updates: few PRs, nothing silently stale.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
