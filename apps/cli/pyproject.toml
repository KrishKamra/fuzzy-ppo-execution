[project]
name = "hftf-cli"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hftf-data",
    "hftf-sim",
    "hftf-rl",
    "hftf-eval",
    "hftf-api",
    "typer>=0.12",
    "rich>=13.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hftf_cli"]

[project.scripts]
hftf = "hftf_cli.main:app"
