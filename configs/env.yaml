# Execution environment defaults (docs/ARCHITECTURE.md §4).
features_path: data/processed/features_1m_v3.parquet
splits:
  train: ["2026-06-03", "2026-08-31"]
  val:   ["2026-09-01", "2026-09-30"]
  test:  ["2026-10-01", "2026-10-19"]
exclude_partial_days: true    # rows carry split = excluded (partial day, profile burn-in)
episode:
  horizons_min: [30, 60, 120]
  earliest_start: "09:20"
  latest_end: "15:15"          # grid end; closing call auction from 2026-08-03 (calendar.py)
  participation_loguniform: [0.01, 0.20]
  sides: [buy, sell]
action:
  a_max: 4.0
  participation_cap: 0.30
regime_inputs: [imb_bar_proxy_ema5, log_spread_var_30m, log_rv_30m]
impact:
  beta: 0.5
  eta: 0.5
  gamma: 0.3
  tau_res_min: 5.0
  volume_floor_frac: 0.01   # V_eff = max(V, 1% of expected volume, 1 share)
  randomise: {eta: [0.25, 1.0], gamma: [0.1, 0.5], tau_res_min: [2.0, 15.0]}
reward:
  risk_aversion: 1.0e-4
  mode: vs_vwap   # | mark_to_market | arrival: per-step credit assignment (ARCHITECTURE §4.6)
  price_drift: expected   # | realised: expected drops the inventory x mid-move noise (decision log 2026-10-24)
tick:                         # TickSim (ARCHITECTURE §4.8): tick sessions only (val 8 + test 12 per stock)
  path: data/processed/l1_1s_v1.parquet   # `hftf data build-l1`
  latency_s: 1                # send at the bar boundary, fill against the L1 state 1 s later
  sub_slices: 1               # orders per decision; each pays the per-order fee (4 orders: +3.2 bps)
  depth_fills: true           # shares within the displayed touch pay the half spread only
limit:                        # passive child orders at the near touch (ARCHITECTURE §4.9); `train ppo --limit`
  enabled: false
  touch_fill_frac: 0.0656     # BarSim θ_touch and θ_through, fitted to the TickSim queue model on val ticks
  through_fill_frac: 0.2942   # (`hftf eval calibrate-limit`): fills capped by the volume traded at our price
  dead_zone: 0.1             # passive fractions <= 0.1 snap to 0, >= 0.9 to 1: one order (one fee) per child
