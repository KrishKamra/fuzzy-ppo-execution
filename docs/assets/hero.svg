<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">Fuzzy Execution</title>
  <desc id="d">Regime-aware optimal execution with an evolving fuzzy PPO agent: an illustrative price path with child-order fills above three fuzzy membership functions and the agent's state.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101215" stop-opacity="1"/>
      <stop offset="0.38" stop-color="#101215" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ECF0F5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ECF0F5" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="glowAmber" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2A93B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DCE4F0" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="420" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Background: graphite, a faint grid and one soft amber glow where the agent works -->
    <rect width="1280" height="420" fill="#101215"/>
    <ellipse cx="985" cy="230" rx="420" ry="260" fill="url(#glowAmber)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>

    <!-- Right: the agent at work (illustrative, not market data). Child-order fills: solid = aggressive, hollow = passive -->
    <g transform="translate(700 70)">
      <path d="M0 70 L30 62 L55 74 L80 58 L105 66 L130 48 L160 55 L190 40 L215 50 L245 34 L270 44 L300 30 L330 38 L360 24 L390 30 L420 16 L450 22 L480 12"
            fill="none" stroke="url(#pathGrad)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <g fill="#F2A93B" stroke="#101215" stroke-width="2">
        <circle cx="130" cy="48" r="5"/><circle cx="190" cy="40" r="6.5"/><circle cx="300" cy="30" r="5.5"/><circle cx="420" cy="16" r="7"/>
      </g>
      <g fill="none" stroke="#F2A93B" stroke-width="2">
        <circle cx="245" cy="34" r="5"/><circle cx="360" cy="24" r="6"/><circle cx="480" cy="12" r="5"/>
      </g>
    </g>

    <!-- Right, below: three fuzzy membership functions (LOW / MED / HIGH) and the current state firing MED -->
    <g transform="translate(700 190)">
      <line x1="0" y1="150" x2="500" y2="150" stroke="#DCE4F0" stroke-opacity="0.18" stroke-width="1.5"/>
      <path d="M0 150 C70 150 80 40 125 40 S180 150 250 150" fill="#8B93A0" fill-opacity="0.06" stroke="#8B93A0" stroke-opacity="0.8" stroke-width="2.5"/>
      <path d="M250 150 C320 150 330 40 375 40 S430 150 500 150" fill="#8B93A0" fill-opacity="0.06" stroke="#8B93A0" stroke-opacity="0.8" stroke-width="2.5"/>
      <path d="M110 150 C185 150 200 10 250 10 S315 150 390 150" fill="#F2A93B" fill-opacity="0.12" stroke="#F2A93B" stroke-width="3.5"/>
      <line x1="285" y1="0" x2="285" y2="150" stroke="#ECF0F5" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="4 4"/>
      <circle cx="285" cy="34" r="12" fill="#F2A93B" fill-opacity="0.25"/>
      <circle cx="285" cy="34" r="6" fill="#F2A93B"/>
      <g font-family="'IBM Plex Mono', 'Cascadia Mono', Consolas, monospace" font-size="13" font-weight="500" letter-spacing="1.5" fill="#ECF0F5" fill-opacity="0.45" text-anchor="middle">
        <text x="125" y="172">LOW</text><text x="250" y="172" fill="#F2A93B" fill-opacity="1">MED</text><text x="375" y="172">HIGH</text>
      </g>
    </g>
    <rect width="1280" height="420" fill="url(#fade)"/>

    <!-- Left: mark, name, promise -->
    <g transform="translate(72 96)">
      <g transform="scale(1.5)">
        <rect x="2" y="2" width="60" height="60" rx="14" fill="#1B1F25"/>
        <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
        <path d="M8 46 C14 46 15 27 20 27 S26 46 33 46" fill="none" stroke="#8B93A0" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M31 46 C38 46 39 27 44 27 S50 46 56 46" fill="none" stroke="#8B93A0" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M16 46 C24 46 25 16 32 16 S40 46 48 46" fill="none" stroke="#F2A93B" stroke-width="3.6" stroke-linecap="round"/>
        <circle cx="38.6" cy="27.4" r="6.4" fill="#F2A93B" fill-opacity="0.25"/>
        <circle cx="38.6" cy="27.4" r="3.6" fill="#F2A93B"/>
      </g>
      <g font-family="'IBM Plex Sans Condensed', 'Arial Narrow', 'Segoe UI', sans-serif">
        <text x="0" y="168" font-size="66" font-weight="600" letter-spacing="-0.5" fill="#ECF0F5">Fuzzy <tspan fill="#F2A93B">Execution</tspan></text>
      </g>
      <g font-family="'IBM Plex Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
        <text x="2" y="212" font-size="22" fill="#ECF0F5" fill-opacity="0.7">Regime-aware optimal execution with an</text>
        <text x="2" y="242" font-size="22" fill="#ECF0F5" fill-opacity="0.7">evolving fuzzy PPO agent you can read.</text>
      </g>
      <g font-family="'IBM Plex Mono', 'Cascadia Mono', Consolas, monospace" font-size="13" font-weight="500" letter-spacing="1.2" fill="#ECF0F5" fill-opacity="0.5">
        <text x="2" y="290">PPO · EVOLVING FUZZY NETWORK · NSE · TICK REPLAY</text>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="11.5" fill="none" stroke="#DCE4F0" stroke-opacity="0.08"/>
</svg>
