[project]
name = "hftf-eval"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hftf-sim",
    "hftf-data",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hftf_eval"]
