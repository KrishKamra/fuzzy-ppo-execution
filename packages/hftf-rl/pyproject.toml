[project]
name = "hftf-rl"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hftf-sim",
    "hftf-fuzzy",
    "torch>=2.5",
    "gymnasium>=1.0",
    "tensorboard>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hftf_rl"]
