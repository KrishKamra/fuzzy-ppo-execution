[project]
name = "hftf-sim"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hftf-data",
    "numpy>=2.0",
    "gymnasium>=1.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hftf_sim"]
